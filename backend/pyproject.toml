[project]
name = "backend"
version = "0.1.0"
description = "BodhiECG GraphDatabase OCR & Ingestion Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "openai>=1.14.0",
    "falkordb>=1.0.0",
    "docling>=2.0.0",
    "pillow>=10.2.0",
    "pypdf>=4.0.0",
    "pytesseract>=0.3.10",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
